name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: |
          npm run typecheck
          npm run check -w @yefengr/pi-subagents

      - name: Test notify
        run: timeout 120 npm test -w @yefengr/pi-notify

      - name: Test monitor
        run: timeout 180 npm test -w @yefengr/pi-monitor

      - name: Test task-efficiency
        run: timeout 180 npm test -w @yefengr/pi-task-efficiency

      - name: Test subagents
        run: timeout 300 npm test -w @yefengr/pi-subagents

      - name: Verify packed contents
        run: npm pack --dry-run --workspaces
