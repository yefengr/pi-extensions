name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: |
          npm run typecheck
          npm run check -w @yefengr/pi-subagents

      - name: Test
        run: npm test

      - name: Verify packed contents
        run: npm pack --dry-run --workspaces
