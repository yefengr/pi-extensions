name: Release

on:
  push:
    branches: [main]
    paths:
      - "packages/*/package.json"
  workflow_dispatch:
    inputs:
      package:
        description: 要发布的 npm 包
        required: true
        type: choice
        options:
          - "@yefengr/pi-notify"
          - "@yefengr/pi-monitor"
          - "@yefengr/pi-subagents"
          - "@yefengr/pi-task-efficiency"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-packages: ${{ steps.plan.outputs.has-packages }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Plan unpublished version changes
        id: plan
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_BEFORE: ${{ github.event.before }}
          RELEASE_PACKAGE: ${{ inputs.package }}
        run: node scripts/release.mjs plan

  verify:
    needs: plan
    if: needs.plan.outputs.has-packages == 'true'
    uses: ./.github/workflows/ci.yml

  pack:
    needs: [plan, verify]
    if: needs.plan.outputs.has-packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PACKAGE_NAME: ${{ matrix.name }}
      PACKAGE_DIRECTORY: ${{ matrix.directory }}
      PACKAGE_VERSION: ${{ matrix.version }}
      ARTIFACT_DIRECTORY: release-artifact
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Run package release checks
        run: npm run prepublishOnly -w "$PACKAGE_NAME"

      - name: Pack workspace with its prepack hook
        run: |
          mkdir -p "$ARTIFACT_DIRECTORY"
          npm pack -w "$PACKAGE_NAME" --pack-destination "$ARTIFACT_DIRECTORY"

      - name: Validate packed identity
        run: node scripts/release.mjs validate-artifact

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.directory }}-${{ matrix.version }}
          path: ${{ env.ARTIFACT_DIRECTORY }}/*.tgz
          if-no-files-found: error

  stage:
    needs: [plan, pack]
    if: needs.plan.outputs.has-packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PACKAGE_NAME: ${{ matrix.name }}
      PACKAGE_DIRECTORY: ${{ matrix.directory }}
      PACKAGE_VERSION: ${{ matrix.version }}
      ARTIFACT_DIRECTORY: release-artifact
    steps:
      - name: Check OIDC token availability
        run: |
          # npm only attempts the trusted-publishing exchange when these are set; otherwise it fails later as a bare ENEEDAUTH.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC id token endpoint is unavailable. This job needs permissions: id-token: write, and the workflow must run from the default branch."
            exit 1
          fi
          echo "OIDC id token endpoint is available."

      - name: Show OIDC claims for publisher matching
        run: |
          # npm rejects a mismatched publisher as 404 "package not found"; print the claims so they can be compared verbatim.
          node --input-type=module -e '
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.append("audience", "npm:registry.npmjs.org");
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`, Accept: "application/json" },
            });
            if (!response.ok) {
              console.error(`::error::OIDC token request failed with HTTP ${response.status}`);
              process.exit(1);
            }
            const { value } = await response.json();
            const claims = JSON.parse(Buffer.from(value.split(".")[1], "base64url").toString("utf8"));
            for (const key of ["aud", "sub", "repository", "workflow", "workflow_ref", "job_workflow_ref", "ref", "environment"]) {
              console.log(`${key}: ${claims[key] ?? "(absent)"}`);
            }
          '

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.directory }}-${{ matrix.version }}
          path: ${{ env.ARTIFACT_DIRECTORY }}

      - name: Validate npm version and downloaded identity
        id: artifact
        run: node scripts/release.mjs validate-artifact

      - name: Submit tarball for npm 2FA approval
        env:
          TARBALL: ${{ steps.artifact.outputs.tarball }}
          # oidc() swallows exchange failures at this level; verbose surfaces the registry's rejection reason.
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm stage publish "$TARBALL" --provenance --access public --ignore-scripts --registry=https://registry.npmjs.org

      - name: Explain pending approval
        run: |
          printf '### %s@%s staged\n\nOpen npmjs.com **Staged Packages** and approve with 2FA. This workflow has not publicly released the package.\n' "$PACKAGE_NAME" "$PACKAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"

  tag:
    needs: [plan, stage]
    if: needs.plan.outputs.has-packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Tag staged commit and summarize
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
          PACKAGE_VERSION: ${{ matrix.version }}
        run: node scripts/github-release.mjs tag "$PACKAGE_DIRECTORY" "$PACKAGE_VERSION" "$GITHUB_SHA"
