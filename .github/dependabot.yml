# 依赖更新：每周为 npm workspaces 与 GitHub Actions 开升级 PR。
# 不启用自动合并；升级 PR 与普通改动一样经过 CI 的 verify 检查后人工合并。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      # 类型定义会跟随对应 Node 大版本；项目最低支持 22.19，升级 major 会让类型脱离运行时下限。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 当前与 rollup-plugin-dts 的 build:types 不兼容，等生态适配后手动升级。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # 开发依赖的小版本与补丁合并为一个 PR，减少评审成本；运行时依赖与大版本仍单独提出。
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
